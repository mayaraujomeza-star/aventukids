<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AventuKids</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--bg:#fff8ec;--line:#f0e3cc;--brand:#ff7a59;--r:22px;--shadow:0 5px 0 rgba(43,45,66,.07),0 10px 24px rgba(43,45,66,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Fredoka','Baloo 2','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;color:var(--ink);--g1:#ffe0ee;--g2:#fff1c9;--g3:#d9efff;--g4:#e2ffe6;background:var(--bg);background-image:linear-gradient(120deg,var(--g1),var(--g2),var(--g3),var(--g4),var(--g1));background-size:300% 300%;animation:bgshift 26s ease infinite;font-size:18px;line-height:1.45;min-height:100vh;padding-bottom:92px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
h1{font-size:2.4rem}h2{font-size:1.5rem}h3{font-size:1.2rem}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid #ffd166;outline-offset:2px}
.bt{font-weight:700;color:#ff7a59;letter-spacing:.3px}.bt b{color:#4c8bf5}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:3px solid var(--line);display:flex;align-items:center;gap:10px;padding:6px 14px;flex-wrap:wrap}
.brand{font-size:1.45rem;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0}
.logo-svg{display:block;flex:none}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{background:#fff0e0;border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600;white-space:nowrap}
.iconbtn{background:#fff;border:2px solid var(--line);border-radius:12px;font-size:1.15rem;padding:3px 9px;cursor:pointer}
.iconbtn.off{opacity:.4;text-decoration:line-through}
main{max-width:980px;margin:0 auto;padding:16px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
body[data-theme=mat]{--g1:#ffe1d6;--g2:#ffd2b8;--g3:#fff0c4;--g4:#ffe0ec}
body[data-theme=esp]{--g1:#d9e8ff;--g2:#e4dcff;--g3:#d2f2ff;--g4:#e8f1ff}
body[data-theme=nat]{--g1:#d6f7e3;--g2:#e5ffd3;--g3:#d4f3ff;--g4:#fffbd0}
body[data-theme=soc]{--g1:#eadcff;--g2:#ffdcf1;--g3:#dde4ff;--g4:#ffe8d6}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:3px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px;z-index:30}
.tab{flex:1;max-width:130px;border:0;background:none;font-size:.78rem;padding:6px 2px;border-radius:14px;color:#6b6e85;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.tab span{font-size:1.5rem;transition:transform .15s}
.tab:hover span{transform:scale(1.2) rotate(-6deg)}
.tab.on{background:#fff0e0;color:#d9482a;font-weight:700}
.btn{font-size:1.1rem;font-weight:600;background:var(--brand);color:#fff;border:0;border-radius:18px;padding:13px 22px;cursor:pointer;box-shadow:0 5px 0 #d45a3b;margin:6px 6px 8px 0;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d45a3b}
.btn.alt{background:#4c8bf5;box-shadow:0 5px 0 #356ad0}
.btn.green{background:#2fb673;box-shadow:0 5px 0 #1f8c55}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:.95rem;border-radius:14px;box-shadow:0 3px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:#356ad0;text-decoration:underline;font-size:1rem;cursor:pointer;padding:6px 0}
.card{background:rgba(255,255,255,.94);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.center{text-align:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.sub{border:3px solid var(--c);background:var(--bg);border-radius:var(--r);padding:16px;text-align:center;cursor:pointer;box-shadow:0 5px 0 var(--c);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.sub:hover{transform:translateY(-4px) rotate(-1deg)}
.sub:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.sub .se{font-size:2.6rem}
.sub b{font-size:1.15rem}
.bar{height:14px;background:#eee;border-radius:99px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff7a59);border-radius:99px;transition:width .6s}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .av{font-size:4rem;background:#fff0e0;border-radius:50%;width:100px;height:100px;display:grid;place-items:center;animation:bob 3s ease-in-out infinite}
.hero .info{flex:1;min-width:220px}
.bubble{background:#eaf1ff;border-radius:16px;padding:6px 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.mascot{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stat{background:#fff0e0;border-radius:14px;padding:6px 12px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:1rem;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;color:#fff;background:var(--c,#999)}
.rcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;cursor:pointer;color:var(--ink);transition:transform .12s}
.rcard:hover{border-color:var(--c);transform:translateX(4px)}
.rcard .em{font-size:2.4rem}
.rcard .stars{margin-left:auto;font-size:1.2rem;white-space:nowrap}
.rtext{font-size:1.35rem;line-height:1.85;margin:12px 0}
.rtext p{margin:.4em 0}
.w{cursor:pointer;border-radius:6px;padding:0 1px;transition:background .15s}
.w:hover{background:#fff3cf}
.w.hl{background:#ffe27a}
.rhead{display:flex;align-items:center;gap:12px}
.rhead .big{font-size:3rem}
.qkind{display:inline-block;background:#eaf1ff;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600}
.opt{display:block;width:100%;text-align:left;font-size:1.2rem;border:3px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;margin:10px 0;cursor:pointer;color:var(--ink);transition:transform .1s,border-color .1s}
.opt:hover:not([disabled]){border-color:#4c8bf5;transform:scale(1.015)}
.opt.good{background:#dff7e9;border-color:#2fb673;animation:bounce .5s}
.opt.bad{background:#ffe3e0;border-color:#ff6b5e;animation:shake .4s}
.opt.gone{opacity:.35;text-decoration:line-through}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt.num{text-align:center;font-size:2rem;font-weight:700}
.bignum{font-size:3.2rem;font-weight:700;margin:12px 0;color:#4c8bf5}
.fb{border-radius:16px;padding:12px 16px;margin:10px 0;font-weight:500}
.fb.ok{background:#dff7e9}.fb.no{background:#fff1d6}
.combo{display:inline-block;background:#ffe9a8;border-radius:999px;padding:2px 12px;font-weight:700;margin-left:6px;animation:bounce .5s}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.stars-big{font-size:2.6rem;letter-spacing:6px}
.bigemoji{font-size:4.5rem;animation:bounce 1s}
.xp{display:inline-block;background:#ffe9a8;border-radius:999px;padding:6px 18px;font-weight:700;font-size:1.3rem;margin:8px 0;animation:bounce .8s}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:12px auto}
.mc{aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:#fff4dc;font-size:1.6rem;cursor:pointer;display:grid;place-items:center;padding:2px;color:var(--ink);font-weight:600}
.mc:hover{background:#ffeccc}
.mc.up{background:#fff;border-color:#4c8bf5;animation:flipin .25s}
.mc.ok{background:#dff7e9;border-color:#2fb673;animation:none}
.slot{display:block;width:100%;text-align:left;border:3px dashed var(--line);border-radius:16px;background:#fff;padding:12px 14px;margin:8px 0;font-size:1.15rem;cursor:pointer;color:var(--ink)}
.slot.filled{border-style:solid;border-color:#4c8bf5}
.slot.good{background:#dff7e9;border-color:#2fb673}
.slot.bad{background:#ffe3e0;border-color:#ff6b5e;animation:shake .4s}
.slot .ph{color:#9a9cb0}
.chipq{display:inline-block;background:#eaf1ff;border:3px solid #cfe0ff;border-radius:16px;padding:10px 14px;margin:5px;font-size:1.1rem;cursor:pointer;color:var(--ink)}
.chipq:hover{transform:scale(1.04)}
.item{font-size:5rem;text-align:center;animation:bounce .5s}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:10px}
.bucket{border:3px solid var(--line);background:#fff;border-radius:18px;padding:14px;font-size:1.2rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-weight:600}
.bucket span{font-size:2rem}
.bucket:hover{transform:scale(1.04)}
.bucket.good{background:#dff7e9;border-color:#2fb673}.bucket.bad{background:#ffe3e0;border-color:#ff6b5e;animation:shake .4s}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf button{font-size:1.4rem;padding:18px}
.track{position:relative;height:46px;background:repeating-linear-gradient(90deg,#e6e8f2 0 22px,#f3f4fa 22px 44px);border-radius:12px;margin:10px 0}
.track .car{position:absolute;top:2px;font-size:1.9rem;transition:left .5s}
.track .flag{position:absolute;right:6px;top:4px;font-size:1.8rem}
.word{font-size:2.4rem;letter-spacing:6px;font-weight:700;margin:10px 0}
.word .L{display:inline-block;min-width:1.1em;border-bottom:4px solid #4c8bf5;margin:0 3px;text-align:center}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:560px;margin:10px auto}
.key{width:46px;height:46px;border-radius:12px;border:3px solid var(--line);background:#fff;font-size:1.15rem;font-weight:600;cursor:pointer;color:var(--ink)}
.key:hover:not([disabled]){background:#eaf1ff}
.key.good{background:#dff7e9;border-color:#2fb673}.key.bad{background:#ffe3e0;border-color:#ff6b5e}
.key[disabled]{cursor:default}
.hearts{font-size:1.4rem}
.sentence{font-size:1.6rem;margin:14px 0;line-height:1.7}
.blank{display:inline-block;min-width:110px;border-bottom:4px dashed #4c8bf5;text-align:center;color:#2fb673;font-weight:700}
.blank.f{border-bottom-style:solid}
.bigq{font-size:1.5rem;font-weight:700;margin:14px 0}
.bubs{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:14px 0;min-height:200px}
.bubb{width:116px;height:116px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 28%,#fff 0 8%,rgba(255,255,255,.55) 9% 17%,rgba(120,210,255,.55) 40%,rgba(80,150,255,.8));font-size:1.1rem;font-weight:700;color:#12335c;cursor:pointer;padding:8px;line-height:1.1;box-shadow:inset 0 -6px 14px rgba(0,80,200,.25),0 6px 14px rgba(0,60,160,.2);animation:bubfloat 3s ease-in-out infinite;animation-delay:calc(var(--k)*-.7s);font-family:inherit}
.bubb:hover:not([disabled]){transform:scale(1.08)}
.bubb.good{background:radial-gradient(circle at 30% 28%,#fff 0 8%,#b8f5cf 40%,#2fb673);animation:bounce .5s}
.bubb.bad{background:radial-gradient(circle at 30% 28%,#fff 0 8%,#ffd0cb 40%,#ff6b5e);animation:shake .4s}
@keyframes bubfloat{0%,100%{translate:0 0}50%{translate:0 -12px}}
.cmp,.seq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.cbox{min-width:84px;padding:14px 12px;border-radius:18px;background:#fff;border:3px solid var(--line);font-size:1.9rem;font-weight:700}
.cbox.q{border-style:dashed;color:#9b6bff}
.cq{font-size:2.6rem;font-weight:700;color:#9b6bff}
.cnt{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:2.2rem;margin:14px auto;max-width:460px}
.pzrow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:12px 0}
.pzslot{min-width:70px;padding:12px;border-radius:14px;border:3px dashed var(--line);font-size:1.6rem;font-weight:700;color:#aaa;background:#fff}
.pzslot.on{border-style:solid;border-color:#2fb673;background:#dff7e9;color:var(--ink)}
.pz{padding:12px 18px;border-radius:14px;border:3px solid #e5578a;background:#fff;font-size:1.6rem;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit;box-shadow:0 4px 0 #e5578a}
.pz.bad{background:#ffe3e0;animation:shake .4s}
.step{display:flex;gap:12px;align-items:flex-start;border:3px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;background:#fff}
.step.done{background:#f1fbf5;border-color:#bfe9d2}
.chk{flex:none;width:44px;height:44px;border-radius:14px;border:3px solid #cbd0e1;background:#fff;font-size:1.6rem;cursor:pointer;display:grid;place-items:center}
.step.done .chk{background:#2fb673;border-color:#2fb673;color:#fff;animation:bounce .4s}
textarea,input[type=text],input[type=password],input[type=url],select{width:100%;font-family:inherit;font-size:1.05rem;border:3px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-weight:600;margin:8px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vid{border-radius:16px;overflow:hidden;background:#000;position:relative;aspect-ratio:16/9;cursor:pointer}
.vid img{width:100%;height:100%;object-fit:cover;opacity:.85}
.vid .play{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;color:#fff;text-shadow:0 2px 8px #000}
.vid iframe{width:100%;height:100%;border:0}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{text-align:center;border-radius:18px;padding:12px 8px;background:#fff;border:3px solid #ffd166}
.badge .be{font-size:2.8rem}
.badge.lock{filter:grayscale(1);opacity:.55;border-color:var(--line)}
.badge small{display:block;line-height:1.2;margin-top:2px}
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.lv{text-align:center;border-radius:16px;padding:8px;background:#f3f3f7;opacity:.6}
.lv.on{background:#ffe9a8;opacity:1;font-weight:700;animation:bounce 1.2s infinite}
.lv.past{background:#dff7e9;opacity:1}
.login{text-align:center;padding-top:12px}
.biglogo{display:flex;justify-content:center;animation:bob 3s ease-in-out infinite}
.sub2{max-width:640px;margin:0 auto 18px}
.stus{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.stu{width:170px;border:3px solid var(--line);background:#fff;border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;box-shadow:var(--shadow);color:var(--ink);transition:transform .12s}
.stu:hover{transform:translateY(-4px) rotate(-1.5deg)}
.stu .av{font-size:3.2rem}
.stu.new{border-style:dashed;justify-content:center;font-weight:600}
.form{max-width:520px;margin:12px auto;text-align:left}
.avs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.avb{font-size:2rem;border:3px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;cursor:pointer}
.avb.on{border-color:var(--brand);background:#fff0e0}
.chestbtn{font-size:1.3rem;animation:wiggle 1.4s infinite}
.modal{position:fixed;inset:0;background:rgba(43,45,66,.55);display:grid;place-items:center;z-index:100;padding:16px}
.mbox{background:#fff;border-radius:26px;padding:22px;max-width:420px;width:100%;text-align:center;max-height:90vh;overflow:auto;animation:pop .3s}
.cel{margin-bottom:10px}.cel .big{font-size:4.5rem;animation:bounce .8s infinite}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:10px 20px;z-index:120;max-width:90vw;text-align:center}
.xpfloat{position:fixed;left:50%;top:38%;font-size:2.2rem;font-weight:700;color:#ff7a59;text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:floatup 1.5s ease-out forwards;z-index:150;pointer-events:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.08)}70%{transform:scale(.97)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes flipin{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@media (max-width:430px){.tab{font-size:.66rem}.tab span{font-size:1.35rem}}
.owlb{margin-left:4px}
.advmap{position:relative;width:100%;max-width:380px;margin:8px auto 24px;background:linear-gradient(180deg,#d9f1ff,#e8ffe6 40%,#fff3cf);border:4px solid #fff;border-radius:28px;box-shadow:var(--shadow)}
.advmap svg{position:absolute;inset:0;width:100%;height:100%}
.trail{fill:none;stroke:#fff;stroke-width:22;stroke-linecap:round;opacity:.95}
.trail2{fill:none;stroke:#d8c7a0;stroke-width:6;stroke-linecap:round;stroke-dasharray:2 12}
.trailp{fill:none;stroke:#ffb703;stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .8s}
.deco{position:absolute;font-size:1.7rem;opacity:.75;transform:translate(-50%,-50%);pointer-events:none;animation:bob 3.4s ease-in-out infinite}
.anode{position:absolute;transform:translate(-50%,-44px);width:132px;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font-family:inherit}
.anode .ring{width:84px;height:84px;border-radius:50%;padding:6px;background:conic-gradient(var(--c) calc(var(--p)*1%),#d9dbe8 0);box-shadow:0 5px 0 rgba(43,45,66,.15);transition:transform .15s}
.anode:hover .ring,.anode.sel .ring{transform:scale(1.1)}
.anode .in{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;font-size:2.3rem}
.anode.fresh .in{filter:grayscale(.55);opacity:.85}
.anode.done .ring{box-shadow:0 0 0 4px #ffd166,0 0 18px #ffd166}
.anode b{font-size:.85rem;line-height:1.1;text-shadow:0 1px 0 #fff;margin-top:2px}
.anode .st3{font-size:.8rem;letter-spacing:1px}
.anode .mb{display:flex;gap:2px;font-size:.85rem}
.anode .mb i{font-style:normal;filter:grayscale(1);opacity:.35}.anode .mb i.got{filter:none;opacity:1}
.anode.sel b{background:var(--c);color:#fff;border-radius:10px;padding:1px 6px;text-shadow:none}
.here{position:absolute;left:100%;top:-6px;margin-left:-14px;display:flex;flex-direction:column;align-items:center;animation:bob 1.2s ease-in-out infinite;z-index:2}
.here .hav{font-size:2rem;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.here small{background:var(--ink);color:#fff;border-radius:999px;padding:0 8px;font-size:.7rem;white-space:nowrap}
.anode:nth-of-type(even) .here{left:auto;right:100%;margin-left:0;margin-right:-14px}
.goal{margin:10px 0}.goal span{margin-right:8px}
.lockp{opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes chestin{0%{transform:translateY(-300px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes wig{0%,30%,100%{transform:rotate(0)}6%{transform:rotate(-6deg)}12%{transform:rotate(6deg)}18%{transform:rotate(-5deg)}24%{transform:rotate(5deg)}}

.sp{position:absolute;font-size:1.6rem;animation:twk 1.6s ease-in-out infinite}.s1{left:8%;top:45%}.s2{right:10%;top:38%;animation-delay:.5s}.s3{left:24%;top:70%;animation-delay:1s}
.chestw{position:absolute;left:50%;bottom:0;width:190px;margin-left:-95px;background:none;border:0;padding:0;cursor:pointer;animation:chestin .7s cubic-bezier(.3,1.5,.5,1) both,wig 1.8s ease-in-out .8s infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.chestw svg{width:100%;display:block;overflow:visible}

.lid{transform-origin:15px 62px;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.open .lid{transform:rotate(-38deg) translate(-4px,-6px)}
.glow{opacity:0;transition:opacity .4s}.open .glow{opacity:1}
.ch{position:absolute;left:50%;bottom:92px;width:64px;margin-left:-32px;font-size:3.2rem;line-height:1;opacity:0;transform:translate(var(--dx),var(--dy));z-index:2}

.ci{display:inline-block;animation:bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.3s)}

.intro h2{color:#fff;margin:.2em 0}.intro p{color:#f1ecff;margin:.2em 0 .6em}

/* ============ Contenido ============ */

const LEVELS=[

/* En cada pregunta la PRIMERA opción es la correcta (se mezclan al jugar). k: 'L' = está en el texto · 'I' = hay que pensar */
const READINGS=[
 /* ---------- Matemáticas ---------- */
 {id:'m1',subj:'mat',title:'La tiendita de Sofía',emoji:'🍎',text:[
  'Sofía tiene una tiendita en su casa.',
  'Hoy vendió 5 manzanas por la mañana y 7 manzanas por la tarde.',
  'Cada manzana cuesta 2 monedas. Al final del día, Sofía guardó todas sus monedas en una alcancía.'],
  qs:[{k:'L',q:'¿Cuántas manzanas vendió Sofía por la mañana?',o:['5 manzanas','7 manzanas','2 manzanas'],why:'El texto dice que vendió 5 manzanas por la mañana.'},
      {k:'I',q:'¿Cuántas manzanas vendió en total durante el día?',o:['12 manzanas','11 manzanas','13 manzanas'],why:'5 + 7 = 12.'},
      {k:'I',q:'Si una manzana cuesta 2 monedas, ¿cuántas monedas pagas por 3 manzanas?',o:['6 monedas','5 monedas','8 monedas'],why:'2 + 2 + 2 = 6.'}]},
 {id:'m2',subj:'mat',title:'La fiesta de Tomás',emoji:'🎂',text:[
  'Tomás cumplió 8 años y hizo una fiesta.',
  'A la fiesta llegaron 6 amigos.',
  'La mamá de Tomás preparó 14 empanadas y las repartió en partes iguales entre todos los niños, incluido Tomás.'],
  qs:[{k:'L',q:'¿Cuántos años cumplió Tomás?',o:['8 años','6 años','14 años'],why:'El texto dice que Tomás cumplió 8 años.'},
      {k:'I',q:'¿Cuántos niños había en la fiesta, contando a Tomás?',o:['7 niños','6 niños','8 niños'],why:'6 amigos + Tomás = 7 niños.'},
      {k:'I',q:'¿Cuántas empanadas le tocaron a cada niño?',o:['2 empanadas','1 empanada','3 empanadas'],why:'14 empanadas entre 7 niños: a cada uno le tocan 2.'}]},
 {id:'m3',subj:'mat',title:'Las figuras del parque',emoji:'🔺',text:[
  'En el parque hay un tobogán con forma de triángulo. El columpio está dentro de un cuadrado de madera. La fuente del centro es un círculo.',

      {k:'L',q:'¿Cuántos lados tiene un cuadrado?',o:['4 lados','3 lados','Ninguno'],why:'El texto dice que un cuadrado tiene 4 lados.'},

 {id:'m4',subj:'mat',title:'El reloj de Camila',emoji:'⏰',text:[
  'Camila se despierta a las 6 de la mañana. Una hora después desayuna.',

  qs:[{k:'L',q:'¿A qué hora se despierta Camila?',o:['A las 6 de la mañana','A las 7 de la mañana','A las 8 de la mañana'],why:'Se despierta a las 6 de la mañana.'},
      {k:'I',q:'¿A qué hora desayuna Camila?',o:['A las 7','A las 8','A las 5'],why:'Se despierta a las 6 y desayuna una hora después: 7.'},
      {k:'I',q:'Camila llega a la escuela a las 8 y las clases terminan a las 12. ¿Cuántas horas está en clases?',o:['4 horas','3 horas','5 horas'],why:'De 8 a 12 hay 4 horas.'}]},
 {id:'m5',subj:'mat',title:'Las canicas de Mateo',emoji:'🔵',text:[
  'Mateo tiene 15 canicas azules y 9 canicas rojas.',

      {k:'I',q:'¿Cuántas canicas tuvo Mateo después del regalo de Laura?',o:['30 canicas','29 canicas','33 canicas'],why:'24 + 6 = 30.'},
      {k:'I',q:'Al final, ¿cuántas canicas tiene Mateo?',o:['25 canicas','35 canicas','24 canicas'],why:'30 − 5 = 25.'}]},
 {id:'m6',subj:'mat',title:'Repartiendo galletas',emoji:'🍪',text:[

      {k:'I',q:'Si le da una bolsa a cada nieto, ¿cuántas bolsas le sobran?',o:['1 bolsa','2 bolsas','Ninguna'],why:'Arma 4 bolsas y tiene 3 nietos: sobra 1.'}]},
 /* ---------- Lengua Castellana ---------- */
 {id:'e1',subj:'esp',title:'Bigotes y la luna',emoji:'🐱',text:[

 {id:'e2',subj:'esp',title:'La semilla viajera',emoji:'🌼',text:[
  'Una semilla de diente de león soñaba con conocer el mundo.',

 {id:'e3',subj:'esp',title:'El patito diferente',emoji:'🦢',text:[
  'Un patito nació más grande y más gris que sus hermanos. Todos se burlaban de él, y por eso se fue lejos.',

  qs:[{k:'L',q:'¿Por qué se fue lejos el patito?',o:['Porque todos se burlaban de él','Porque quería viajar','Porque se perdió'],why:'Sus hermanos y los demás se burlaban de él.'},

 {id:'e4',subj:'esp',title:'Una carta para la abuela',emoji:'✉️',text:[

      {k:'I',q:'¿Qué siente Daniel por su abuela?',o:['La quiere y la extraña','Está enojado con ella','No se acuerda de ella'],why:'Dice que la extraña mucho y se despide con cariño.'}]},
 {id:'e5',subj:'esp',title:'El zorro y las uvas',emoji:'🍇',text:[
  'Un zorro hambriento vio unas uvas muy maduras colgando de una parra alta.',

 {id:'e6',subj:'esp',title:'Un día de lluvia',emoji:'☔',text:[
  'Llovió toda la tarde y Luisa no pudo salir a jugar. Entonces armó un fuerte con cobijas y almohadas en la sala.',

 /* ---------- Ciencias Naturales ---------- */
 {id:'c1',subj:'nat',title:'Las plantas y lo que necesitan',emoji:'🌱',text:[

 {id:'c2',subj:'nat',title:'De huevo a rana',emoji:'🐸',text:[

 {id:'c3',subj:'nat',title:'Los cinco sentidos',emoji:'👀',text:[

 {id:'c4',subj:'nat',title:'El viaje del agua',emoji:'💧',text:[
  'El Sol calienta el agua de los ríos y del mar, y esta se convierte en vapor que sube al cielo.',
  'Arriba hace frío y el vapor forma las nubes. Cuando las nubes están muy cargadas, el agua cae como lluvia.',
  'La lluvia llena los ríos y el viaje del agua comienza de nuevo.'],
  qs:[{k:'L',q:'¿Qué calienta el agua de los ríos y del mar?',o:['El Sol','El viento','La Luna'],why:'El Sol calienta el agua.'},

      {k:'I',q:'¿Qué pasaría si el Sol no calentara el agua?',o:['Se formaría menos vapor y habría menos nubes','Llovería mucho más','Las nubes serían de colores'],why:'Sin calor no se forma el vapor que hace las nubes.'}]},
 {id:'c5',subj:'nat',title:'¿Qué comen los animales?',emoji:'🦁',text:[
  'Los animales se alimentan de diferentes maneras.',
  'Los herbívoros, como la vaca y el conejo, comen plantas. Los carnívoros, como el león y el tigre, comen carne.',
  'Los omnívoros, como el oso pardo, comen plantas y carne.'],
  qs:[{k:'L',q:'¿Qué comen los herbívoros?',o:['Plantas','Carne','Piedras'],why:'Los herbívoros comen plantas.'},
      {k:'L',q:'¿Cuál de estos animales es carnívoro?',o:['El león','El conejo','La vaca'],why:'El león y el tigre comen carne.'},
      {k:'I',q:'El cerdo come plantas y también carne. ¿Qué tipo de animal es?',o:['Omnívoro','Herbívoro','Carnívoro'],why:'Los que comen plantas y carne son omnívoros.'}]},
 {id:'c6',subj:'nat',title:'El Sol y la Luna',emoji:'🌙',text:[
  'El Sol es una estrella que nos da luz y calor.',
  'La Tierra gira alrededor del Sol y tarda un año en dar la vuelta completa. La Luna gira alrededor de la Tierra y tarda cerca de un mes.',
  'Cuando un lugar de la Tierra mira hacia el Sol es de día. Cuando se aleja, es de noche.'],
  qs:[{k:'L',q:'¿Qué es el Sol?',o:['Una estrella','Un planeta','Una nube'],why:'El texto dice que el Sol es una estrella.'},
      {k:'L',q:'¿Alrededor de qué gira la Luna?',o:['De la Tierra','Del Sol','De una estrella'],why:'La Luna gira alrededor de la Tierra.'},
      {k:'I',q:'¿Por qué es de noche en un lugar de la Tierra?',o:['Porque ese lugar no mira hacia el Sol','Porque el Sol se apaga','Porque la Luna tapa el cielo'],why:'Cuando el lugar se aleja del Sol, es de noche.'}]},

 {id:'s2',subj:'soc',title:'Los símbolos de Colombia',emoji:'🦅',text:[

  'La bandera tiene tres colores: amarillo, azul y rojo. La franja amarilla es la más ancha.',

 {id:'s3',subj:'soc',title:'Las normas del salón',emoji:'📏',text:[

 {id:'s4',subj:'soc',title:'Los medios de transporte',emoji:'🚌',text:[
  'Las personas usamos diferentes medios de transporte para viajar.',
  'Por tierra van los buses, los carros y los trenes. Por el agua navegan los barcos y las canoas. Por el aire vuelan los aviones y los helicópteros.',

 {id:'s5',subj:'soc',title:'Las regiones de Colombia',emoji:'🗺️',text:[
  'Colombia tiene cinco regiones naturales: Caribe, Andina, Pacífica, Orinoquía y Amazonía.',
  'La región Caribe está al norte y tiene playas y mar. La región Andina tiene grandes montañas, y allí queda Bogotá.',

 {id:'s6',subj:'soc',title:'Los derechos de los niños',emoji:'🧒',text:[
  'Todos los niños tienen derechos: a tener una familia, a ir a la escuela, a jugar, a recibir atención médica y a ser tratados con respeto.',

function award(s,o){
  const before=levelInfo(s.xp).idx,xp=o.xp||0;
  s.xp+=xp;
  s.log.push({t:Date.now(),type:o.type,subject:o.subject||'',title:o.title||'',score:o.score==null?null:o.score,total:o.total==null?null:o.total,xp});
  if(s.log.length>500)s.log.splice(0,s.log.length-500);
  const newBadges=checkBadges(s),adv=checkAdv(s);
  if(adv.list.length){
    s.xp+=adv.bonus;
    s.log.push({t:Date.now(),type:'aventura',subject:'',title:adv.list.map(a=>a.adv.name+' '+'⭐'.repeat(a.stars)).join(', '),score:null,total:null,xp:adv.bonus});
    checkBadges(s).forEach(b=>newBadges.push(b));
  }
  const after=levelInfo(s.xp).idx;
  save();
  return {xp,newBadges,levelUp:after>before?LEVELS[after]:null,advs:adv.list,bonus:adv.bonus};
}

function ensureCtx(){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;actx=new AC();}if(actx.state==='suspended')actx.resume();}catch(e){return null;}return actx;}
function tone(f,t0,dur,type,vol,slide){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.03);
}
function seq(notes){if(!db.sound)return;try{if(!ensureCtx())return;const t=actx.currentTime;notes.forEach(n=>tone(n[0],t+(n[1]||0),n[2]||0.12,n[3],n[4],n[5]));}catch(e){}}

  if(!db.music||!actx||document.hidden)return;
  const t=actx.currentTime+0.05,beat=0.4;
  for(let i=0;i<4;i++){if(Math.random()<0.75)tone(pick(PENTA),t+i*beat,beat*0.9,'triangle',0.035);}

const GM={id:null,timer:null,next:0,bar:0};
function gmBar(T,t0){
  const pat=T.pats[GM.bar%T.pats.length],root=T.roots[GM.bar%T.roots.length];
  for(let i=0;i<8;i++){
    const ti=t0+i*T.d,p=pat[i];
    if(p>=0){const n=T.base+T.sc[p%T.sc.length]+12*Math.floor(p/T.sc.length);tone(hz(n),ti,T.d*T.gate,T.mw,T.vol,T.slide?hz(n)*1.25:0);}
    if(T.bm==='half'){if(i%4===0)tone(hz(root),ti,T.d*3.6,'sine',.06);}
    else if(T.bm==='offbeat'){if(i%2===0)tone(hz(i%4===2?root+7:root),ti,T.d*.9,'sine',.06);}
    else if(T.bm==='pulse'){tone(hz(i%2?root+12:root),ti,T.d*.8,'triangle',.05);}
    if(T.perc==='tick')tone(4000,ti,.02,'square',.012);
    else if(T.perc==='both'){if(i%4===0)tone(150,ti,.12,'sine',.12,45);else if(i%2)tone(5000,ti,.02,'square',.01);}
  }
}
function gmPump(){
  const T=TRACKS[GM.id];if(!T||!actx||!db.sound||document.hidden)return;
  try{const bl=T.d*8;while(GM.next<actx.currentTime+bl*1.2){if(GM.next<actx.currentTime)GM.next=actx.currentTime+0.05;gmBar(T,GM.next);GM.next+=bl;GM.bar++;}}catch(e){}
}
function startGM(id){stopGM();if(!TRACKS[id]||!ensureCtx())return;GM.id=id;GM.next=0;GM.bar=0;gmPump();GM.timer=setInterval(gmPump,Math.max(150,TRACKS[id].d*2000));}
function stopGM(){if(GM.timer){clearInterval(GM.timer);GM.timer=null;}GM.id=null;}
function wantTrack(){if(!cur()||view.name==='teacher'||db.gmusic===false)return null;if(view.name==='game'&&TRACKS[view.id])return view.id;return null;}

function voiceScore(v){
  const n=(v.name||'').toLowerCase(),l=(v.lang||'').toLowerCase().replace('_','-');
  if(l.indexOf('es')!==0)return -100;
  let sc=1;
  if(/natural|online|neural/.test(n))sc+=3;
  if(/paulina|m[oó]nica|sabina|helena|salome|dalia|paloma|elvira|laura|luc[ií]a|marisol|esperanza|google/.test(n))sc+=4;
  if(/jorge|diego|juan|carlos|pablo|ra[uú]l|[aá]lvaro|enrique|male|jaime|gonzalo|alonso|tom[aá]s/.test(n))sc-=6;
  if(/^es-(co|mx|us|419)/.test(l))sc+=2;
  return sc;
}
function pickVoice(){try{let best=null,b=-50;speechSynthesis.getVoices().forEach(v=>{const x=voiceScore(v);if(x>b){b=x;best=v;}});return best;}catch(e){return null;}}
function speak(text,opts){
  if(!('speechSynthesis' in window)){toast('Tu navegador no puede leer en voz alta');return null;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-CO';u.rate=(opts&&opts.rate)||0.85;u.pitch=(opts&&opts.pitch)||1.15;
  const v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u);return u;
}

function advGoals(s,A){
  if(A.subj){
    const all=allReads().filter(r=>r.subj===A.subj),ps=all.filter(r=>passed(s,r.id)).length;
    const gp=A.games.filter(id=>s.games[id]).length,pr=PROJECTS.filter(P=>P.subj.includes(A.subj)),pd=pr.filter(P=>s.projects[P.id]&&s.projects[P.id].done).length;
    return [{t:'📖 Lecturas aprobadas',d:ps,n:all.length},{t:'🎮 Juegos probados',d:gp,n:A.games.length},{t:'🛠️ Proyectos terminados',d:pd,n:pr.length}];
  }
  if(A.id==='juegos')return [{t:'🎮 Juegos diferentes probados',d:GAMES.filter(x=>s.games[x.id]).length,n:GAMES.length},{t:'🕹️ Partidas jugadas (meta: 20)',d:Math.min(totalPlays(s),20),n:20}];
  if(A.id==='proy'){let st=0,tot=0;PROJECTS.forEach(P=>{tot+=P.steps.length;const p=s.projects[P.id];if(p)st+=p.steps.filter(Boolean).length;});
    return [{t:'🛠️ Proyectos terminados',d:projDone(s),n:PROJECTS.length},{t:'✔️ Pasos completados',d:st,n:tot}];}
  const li=levelInfo(s.xp);
  return [{t:'⭐ Nivel alcanzado',d:li.idx+1,n:LEVELS.length},{t:'🏅 Insignias ganadas (todas)',d:Object.keys(s.badges).length,n:BADGES.length},{t:'🎬 Videos vistos (meta: 5)',d:Math.min(Object.keys(s.videos).length,5),n:5}];
}
function advInfo(s,A){
  const goals=advGoals(s,A),bd=A.badges.filter(id=>s.badges[id]).length;
  goals.push({t:'🏅 Insignias de esta aventura',d:bd,n:A.badges.length});
  let d=0,n=0;goals.forEach(x=>{d+=Math.min(x.d,x.n);n+=x.n;});
  const pct=n?Math.floor(d/n*100):0;
  return {goals,pct,bd,stars:pct>=100?3:pct>=66?2:pct>=33?1:0};
}
function checkAdv(s){
  s.advStars=s.advStars||{};const list=[];let bonus=0;
  ADV.forEach(A=>{const st=advInfo(s,A).stars,old=s.advStars[A.id]||0;
    if(st>old){let b=0;for(let k=old+1;k<=st;k++)b+=(k===3?25:10);bonus+=b;s.advStars[A.id]=st;list.push({adv:A,stars:st,old,bonus:b});}});
  return {list,bonus};
}

function finishReading(){
  const s=cur(),R=rd.r,prev=s.reads[R.id]||{best:0,attempts:0},total=rd.qs.length;
  let gain=Math.max(0,rd.correct-prev.best)*10;
  if(rd.correct===total&&prev.best<total)gain+=5;
  gain=Math.max(0,gain-2*rd.hints);
  let bonus=0;
  if(R.id===dailyReading().id&&s.dailyDone!==dayKey()&&rd.correct>=Math.ceil(total*0.66)){bonus=10;s.dailyDone=dayKey();s.flags.daily=true;}
  s.reads[R.id]={best:Math.max(prev.best,rd.correct),attempts:prev.attempts+1,total,last:Date.now()};
  rd.result=award(s,{xp:gain+bonus,type:'lectura',subject:R.subj,title:R.title,score:rd.correct,total});
  rd.bonus=bonus;rd.phase='done';
  const pass=rd.correct>=Math.ceil(total*0.66),modal=rd.result.levelUp||rd.result.newBadges.length;
  if(rd.correct===total)confetti();
  if(!modal){if(pass)sfx.win();else sfx.tryagain();}
  celebrate(rd.result);
}

function genCarrera(){
  const idx=levelInfo(cur().xp).idx,max=Math.min(10+idx*5,60),qs=[];
  for(let i=0;i<10;i++){
    let txt,ans;const r=Math.random();
    if(idx>=4&&r<0.25){const a=pick([2,3,4,5,10]),b=Math.floor(Math.random()*9)+1;ans=a*b;txt=a+' × '+b;}
    else if(r<0.6){const a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*max)+1;ans=a+b;txt=a+' + '+b;}
    else{const a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*a);ans=a-b;txt=a+' − '+b;}
    const ds=new Set();let guard=0;while(ds.size<2&&guard++<50){const d=ans+pick([-3,-2,-1,1,2,3,10,-10]);if(d>=0&&d!==ans)ds.add(d);}
    qs.push({txt,ans,opts:shuffle([ans].concat(Array.from(ds)))});

}

function genCompara(){
  const idx=levelInfo(cur().xp).idx,max=Math.min(12+idx*4,40),r=n=>Math.floor(Math.random()*n)+1,qs=[];
  const side=v=>{if(Math.random()<0.5||v<2)return {t:String(v),v};const x=r(v-1);return {t:x+' + '+(v-x),v};};
  for(let i=0;i<8;i++){
    const va=r(max),vb=Math.random()<0.2?va:r(max),A=side(va),B=side(vb),ans=va<vb?'lt':va>vb?'gt':'eq',sym={lt:'<',eq:'=',gt:'>'}[ans];
    const box=(t)=>'<div class="cbox">'+esc(t)+'</div>';

      sp:A.t.replace('+',' más ')+', comparado con, '+B.t.replace('+',' más '),ans,
      opts:[{v:'lt',l:'< Menor'},{v:'eq',l:'= Igual'},{v:'gt',l:'> Mayor'}]});

function genCuenta(){
  const idx=levelInfo(cur().xp).idx,maxA=Math.min(6+idx*2,14),qs=[];
  for(let i=0;i<8;i++){
    const pool=shuffle(OBJ),e1=pool[0],e2=pool[1],a=Math.floor(Math.random()*maxA)+1,b=Math.floor(Math.random()*6)+1;
    const items=shuffle(Array(a).fill(e1).concat(Array(b).fill(e2)));

function genPatron(){
  const qs=[];
  for(let i=0;i<8;i++){
    let seq,ans,opts;
    if(Math.random()<0.5){
      const pt=pick([[0,1],[0,1,1],[0,0,1],[0,1,2],[0,1,2,2]]),n=Math.max.apply(null,pt)+1,em=shuffle(OBJ),L=pt.length*2+(pt.length<3?1:0);
      seq=[];for(let k=0;k<L;k++)seq.push(em[pt[k%pt.length]]);ans=em[pt[L%pt.length]];
      opts=shuffle([ans].concat(shuffle(em.filter(e=>e!==ans)).slice(0,2)));
    }else{
      const step=pick([2,3,5,10,-1,-2]),st=step>0?Math.floor(Math.random()*8)+1:Math.floor(Math.random()*6)+12;
      seq=[];for(let k=0;k<5;k++)seq.push(String(st+step*k));ans=String(st+step*5);
      const ds=new Set();let guard=0;while(ds.size<2&&guard++<60){const d=+ans+pick([-3,-2,-1,1,2,3]);if(d>=0&&String(d)!==ans)ds.add(String(d));}
      opts=shuffle([ans].concat(Array.from(ds)));
    }
    const boxes=seq.map(x=>'<span class="cbox">'+esc(x)+'</span>').join('');
    qs.push({h:'<p class="bigq">¿Qué sigue en la serie?</p><div class="seq">'+boxes+'<span class="cbox q">❓</span></div>',
      hf:'<p class="bigq">¿Qué sigue en la serie?</p><div class="seq">'+boxes+'<span class="cbox" style="border-color:#2fb673;background:#dff7e9">'+esc(ans)+'</span></div>',
      sp:'¿Qué sigue en la serie?',ans,opts:opts.map(x=>({v:x,l:x}))});
  }
  return qs;
}

function viewMap(s){
  const infos=ADV.map(A=>advInfo(s,A)),n=ADV.length,W=360,GAP=128,Y0=64,H=Y0+GAP*(n-1)+96,xs=[72,282,80,276,84,272,180];
  const pts=ADV.map((_,i)=>[xs[i],Y0+GAP*i]);
  let d='M'+pts[0][0]+' '+pts[0][1];
  for(let i=1;i<n;i++){const a=pts[i-1],b=pts[i],my=(a[1]+b[1])/2;d+=' C'+a[0]+' '+my+' '+b[0]+' '+my+' '+b[0]+' '+b[1];}
  let tot=0;for(let i=0;i<n-1;i++){const f=Math.min(1,infos[i].pct/66);tot+=f;if(f<1)break;}
  const frac=tot/(n-1);
  const here=(()=>{const k=infos.findIndex(x=>x.stars<3);return k<0?n-1:k;})();
  const sel=ADV.find(a=>a.id===view.sel);
  const nodes=ADV.map((A,i)=>{const I=infos[i],x=pts[i][0],y=pts[i][1];
    const bi=A.badges.slice(0,5).map(id=>{const b=BADGES.find(z=>z.id===id);return b?'<i class="'+(s.badges[id]?'got':'')+'" title="'+esc(b.name)+'">'+b.emoji+'</i>':'';}).join('');
    return '<button class="anode'+(sel&&sel.id===A.id?' sel':'')+(I.stars===3?' done':'')+(I.stars===0?' fresh':'')+'" style="left:'+(x/W*100)+'%;top:'+(y/H*100)+'%;--c:'+A.c+';--p:'+I.pct+'" data-act="advPick" data-id="'+A.id+'" aria-label="'+esc(A.name)+', '+I.pct+' por ciento">'+
      (i===here?'<span class="here"><span class="hav">'+s.avatar+'</span><small>¡Estás aquí!</small></span>':'')+
      '<span class="ring"><span class="in">'+A.emoji+'</span></span><b>'+A.name+'</b><span class="st3">'+stars3(I.stars)+'</span><span class="mb">'+bi+'</span></button>';}).join('');
  const deco=[['☁️',8,6],['☁️',80,14],['🌴',6,30],['🌲',88,48],['🌸',10,62],['🦋',86,70],['⛵',12,86],['✨',84,94]].map(x=>'<span class="deco" style="left:'+x[1]+'%;top:'+x[2]+'%">'+x[0]+'</span>').join('');
  const totStars=infos.reduce((a,i)=>a+i.stars,0);
  let detail='';
  if(sel){
    const I=infos[ADV.indexOf(sel)];
    const gl=I.goals.map(g=>{const p=g.n?Math.round(Math.min(g.d,g.n)/g.n*100):0;return '<div class="goal"><span>'+g.t+'</span><b>'+Math.min(g.d,g.n)+' / '+g.n+'</b><div class="bar"><i style="width:'+p+'%"></i></div></div>';}).join('');
    const bd=sel.badges.map(id=>{const b=BADGES.find(z=>z.id===id);if(!b)return '';return s.badges[id]?'<span class="pill">'+b.emoji+' '+esc(b.name)+' ✅</span> ':'<span class="pill lockp">🔒 '+esc(b.name)+' — '+esc(b.desc)+'</span> ';}).join('');
    detail='<div class="card" style="border:3px solid '+sel.c+'"><div class="rhead"><span class="big">'+sel.emoji+'</span><div><h2>'+sel.name+'</h2><div class="st3">'+stars3(I.stars)+' · '+I.pct+'%</div></div></div>'+
      '<div class="note">🦉 '+sel.owl+'</div><div class="bar"><i style="width:'+I.pct+'%"></i></div>'+gl+
      '<h3>Medallas de esta aventura</h3><p>'+bd+'</p><div class="noprint"><button class="btn alt" data-act="advGo" data-id="'+sel.id+'">¡Ir a la aventura! 🚀</button><button class="btn ghost" data-act="advSpeak" data-id="'+sel.id+'">🦉 Escuchar</button></div>'+
      '<p><small>⭐ 1 estrella al 33%, 2 al 66% y 3 al 100%. Cada estrella da XP de bonus.</small></p></div>';
  }
  return '<h2>🗺️ Mi mapa de aventuras</h2><p>Cada lugar es una aventura. ¡Llena el camino y gana estrellas y medallas! '+owlBtn('map')+'</p>'+
    '<div class="chips"><span class="pill">⭐ Estrellas: <b>'+totStars+' / '+(n*3)+'</b></span><span class="pill">🏅 Insignias: <b>'+Object.keys(s.badges).length+' / '+BADGES.length+'</b></span></div>'+detail+
    '<div class="advmap" style="aspect-ratio:'+W+'/'+H+'"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+'" class="trail"/><path d="'+d+'" class="trail2"/><path d="'+d+'" class="trailp" pathLength="100" style="stroke-dasharray:'+(frac*100).toFixed(1)+' 100"/></svg>'+deco+nodes+'</div>';
}

/* ============ Panel del docente ============ */
const LOGT={lectura:'📖 Lectura',juego:'🎮 Juego',proyecto:'🛠️ Proyecto',paso:'✔️ Paso de proyecto',video:'🎬 Video',cofre:'🎁 Cofre del día',aventura:'🗺️ Aventura'};
function subjAcc(s,k){let a=0,t=0;s.log.forEach(l=>{if(l.type==='lectura'&&l.subject===k&&l.total){a+=l.score;t+=l.total;}});return t?Math.round(a/t*100):null;}
function sumStats(s){let sc=0,tot=0;s.log.forEach(l=>{if(l.type==='lectura'&&l.total){sc+=l.score;tot+=l.total;}});
  return {passed:passedCount(s),acc:tot?Math.round(sc/tot*100):null,games:totalPlays(s),projects:projDone(s),badges:Object.keys(s.badges).length,vids:Object.keys(s.videos).length};}
function viewTeacher(){
  const head='<header class="top"><button class="brand" data-act="tLogout">'+logo(40)+BRAND+' <small style="font-size:.9rem;color:#6b6e85">· Docente</small></button><div class="who"><button class="btn sm ghost" data-act="tLogout">← Salir del panel</button></div></header>';
  if(!teacher.authed)return head+'<main><div class="card form center"><h2>👩‍🏫 Panel del docente</h2><p>Escribe el PIN para entrar.</p><input type="password" id="pin" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn" data-act="tAuth">Entrar</button><p><small>PIN inicial: 1234 (puedes cambiarlo en Ajustes).</small></p></div></main>';
  const tabs=[['students','👧 Estudiantes'],['visits','📋 Ingresos'],['content','📚 Contenido'],['settings','⚙️ Ajustes']];
  let body='';
  if(teacher.tab==='students')body=tStudents();else if(teacher.tab==='visits')body=tVisits();else if(teacher.tab==='content')body=tContent();else body=tSettings();
  return head+'<main><div class="chips noprint">'+tabs.map(t=>'<button class="chip'+(teacher.tab===t[0]?' on':'')+'" data-act="tTab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+body+'</main>';

(function(){
  const cv=document.createElement('canvas');cv.id='bg';cv.setAttribute('aria-hidden','true');

  const SYMS=['⭐','🌈','☁️','🎈','🦋','🌸','🚀','📚','✏️','🌟','🍎','🐝','A','B','C','M','1','2','3','7','+','=','?','!'];
  const HUES=[345,20,45,95,150,190,215,265,300];

  const rnd=(a,b)=>a+Math.random()*(b-a);
  function mkItem(){
    const blob=Math.random()<0.5;
    return {x:rnd(0,W),y:rnd(0,H),vx:rnd(-0.25,0.25),vy:rnd(-0.35,0.1),r:blob?rnd(18,55):rnd(20,34),blob,hue:pick(HUES),sym:pick(SYMS),rot:rnd(0,6.28),vr:rnd(-0.01,0.01),ph:rnd(0,6.28)};
  }

    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.max(14,Math.min(32,Math.round(W*H/36000)));items=[];for(let i=0;i<n;i++)items.push(mkItem());
  }
  function burst(x,y,n,hue){
    for(let i=0;i<n&&parts.length<220;i++){
      const a=rnd(0,6.283),sp=rnd(1.5,6);
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,r:rnd(3,8),hue:hue==null?pick(HUES):hue+rnd(-25,25),star:Math.random()<0.25});
    }
  }
  function paint(){
    ctx.clearRect(0,0,W,H);
    items.forEach(it=>{
      if(it.blob){
        const gr=ctx.createRadialGradient(it.x-it.r*0.3,it.y-it.r*0.3,it.r*0.1,it.x,it.y,it.r);
        gr.addColorStop(0,'hsla('+it.hue+',95%,86%,.75)');gr.addColorStop(1,'hsla('+it.hue+',90%,66%,.28)');
        ctx.fillStyle=gr;ctx.beginPath();ctx.arc(it.x,it.y,it.r*(1+Math.sin(it.ph)*0.04),0,6.283);ctx.fill();
        ctx.strokeStyle='hsla('+it.hue+',90%,60%,.35)';ctx.lineWidth=2;ctx.stroke();

        ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);ctx.textAlign='center';ctx.textBaseline='middle';
        if(/^[A-Za-z0-9+=?!]$/.test(it.sym)){ctx.font='700 '+it.r*1.3+'px Fredoka,Trebuchet MS,sans-serif';ctx.fillStyle='hsla('+it.hue+',85%,55%,.42)';}
        else{ctx.font=it.r+'px serif';ctx.globalAlpha=0.6;}
        ctx.fillText(it.sym,0,0);ctx.restore();
      }
    });
    parts.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='hsl('+p.hue+',95%,60%)';
      if(p.star){ctx.font=(p.r*3)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',p.x,p.y);}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(0.3,p.life),0,6.283);ctx.fill();}
    });
    ctx.globalAlpha=1;
  }
  function step(k){
    items.forEach(it=>{
      it.ph+=0.02*k;it.x+=(it.vx+Math.sin(it.ph)*0.15)*k;it.y+=it.vy*k;it.rot+=it.vr*k;
      const dx=it.x-mx,dy=it.y-my,d2=dx*dx+dy*dy,R=150;
      if(d2<R*R&&d2>1){const d=Math.sqrt(d2),f=(1-d/R)*3.2*k;it.x+=dx/d*f;it.y+=dy/d*f;}
      if(it.x<-70)it.x=W+70;else if(it.x>W+70)it.x=-70;
      if(it.y<-70)it.y=H+70;else if(it.y>H+70)it.y=-70;

    parts.forEach(p=>{p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=0.15*k;p.vx*=0.99;p.life-=0.02*k;});

  function start(){if(running||reduce||!window.requestAnimationFrame)return;running=true;last=performance.now();window.requestAnimationFrame(frame);}
  function popAt(x,y){
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];
      if(it.blob&&(it.x-x)*(it.x-x)+(it.y-y)*(it.y-y)<(it.r+6)*(it.r+6)){
        burst(it.x,it.y,20,it.hue);sfx.bubble();
        it.y=H+60;it.x=rnd(0,W);it.hue=pick(HUES);it.r=rnd(18,55);return true;
      }
    }
    return false;
  }
  document.addEventListener('pointermove',e=>{
    mx=e.clientX;my=e.clientY;
    if(e.pointerType==='mouse'){const now=performance.now();if(now-trailT>45){trailT=now;burst(mx,my,1);}}
  },{passive:true});
  document.addEventListener('pointerup',e=>{if(e.pointerType&&e.pointerType!=='mouse'){mx=-999;my=-999;}},{passive:true});
  document.addEventListener('pointerdown',e=>{
    const x=e.clientX,y=e.clientY;mx=x;my=y;
    const t=e.target;
    const onUI=!!(t&&t.closest&&t.closest('button,a,input,select,textarea,.card,.stu,.sub,.rcard,.step,.modal,.tabs,.top,.opt,.vid'));
    if(!onUI&&popAt(x,y))return;
    burst(x,y,onUI?6:12);
  },{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)running=false;else start();});
  let rz=null;
  window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{size();if(reduce)paint();},150);});
  size();
  if(reduce)paint();else start();
})();
render();
</script>
